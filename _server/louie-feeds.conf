# Feed serving for louie.se.
#
# INCLUDE THIS INSIDE THE EXISTING server { } BLOCK:
#
#     server {
#         ...existing config...
#         include sites/louie.se/headers.conf;
#         include sites/louie.se/feeds.conf;
#     }
#
# It sets no listen/ssl/server_name, so it cannot disturb TLS or anything else
# already configured.
#
# Each location repeats `root` on purpose. In louie.se.conf the root is declared
# inside `location /`, not at server level, and a regex location takes priority
# over `location /` while inheriting nothing from it. Without its own root,
# nginx looks under the compiled-in default, finds nothing, and error_page 404
# turns every feed request into a 301 to /lost/.
#
# If root is ever moved up to server level, these three lines can go.

# Atom first. The two regexes are mutually exclusive -- a URL ending in
# feed/atom/ or feed/atom/index.xml cannot match the RSS alternative, which
# requires it to end in feed.xml, feed/ or feed/index.xml -- but nginx is
# first-match-wins for regex locations, so the order is documented rather than
# relied upon.
location ~ ^/(?:.+/)?(?:atom\.xml|feed/atom/(?:index\.xml)?)$ {
    root  /mnt/storage/louie.se/www2;
    # Serves the alias at /feed/atom/. The internal redirect to
    # /feed/atom/index.xml re-runs location matching and lands back here, so the
    # Content-Type below applies either way. `location /` declares its own index
    # without index.xml, which is why this cannot be set once at server level.
    index index.xml;
    types { }
    default_type "application/atom+xml; charset=utf-8";
    include sites/louie.se/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~ ^/(?:.+/)?(?:feed\.xml|feed/(?:index\.xml)?)$ {
    root  /mnt/storage/louie.se/www2;
    index index.xml;
    types { }
    default_type "application/rss+xml; charset=utf-8";
    include sites/louie.se/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
}

# The old overlay carried a site-wide Access-Control-Allow-Origin of
# https://louie.se. A fixed same-origin ACAO grants nothing that same-origin
# access does not already have, so CORS now appears only on feeds, where
# browser-based readers genuinely need it.
#
# _headers itself was Cloudflare Pages syntax nginx never read, published at
# /_headers for anyone to fetch. Delete it from the document root; the upload
# has no --delete, so removing it from the repo did not unpublish it:
#
#     rm /mnt/storage/louie.se/www2/_headers
