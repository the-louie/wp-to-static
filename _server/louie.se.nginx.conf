# nginx configuration for louie.se.
#
# This replaces _overlay/_headers, which was Cloudflare Pages syntax on an
# nginx host. It did nothing at all, and because it sat in _overlay/ it was
# rsynced into the site root and served at https://louie.se/_headers, which
# published the intended CSP to anyone who asked. None of the security headers
# below have ever actually been live.
#
# Deploying this is a server-side change; the generator cannot do it. Two
# things must happen together:
#
#   1. Install this config (and louie-security-headers.conf next to it).
#   2. rm /mnt/storage/louie.se/www2/_headers on the target -- the upload rsync
#      has no --delete, so removing the file from the repo does not unpublish
#      it.
#
# Do not ship the corrected feed Content-Types without nosniff, or nosniff
# without the Content-Types. Today feeds are served as text/xml and readers
# sniff their way to the right answer; turning on nosniff alone would break
# every browser-based reader. They are one deploy.

server {
    server_name louie.se;
    root /mnt/storage/louie.se/www2;

    # index.xml is what makes /feed/ and /tag/<slug>/feed/ resolve to the
    # aliases the generator writes. A request for /feed (no trailing slash)
    # gets a 301 to /feed/ from the index module, so the old WordPress URLs
    # keep working without a redirect rule.
    index index.html index.xml;

    include /etc/nginx/snippets/louie-security-headers.conf;

    # Atom first. The two regexes are mutually exclusive -- a URL ending in
    # feed/atom/ or feed/atom/index.xml cannot match the RSS alternative, which
    # requires it to end in feed.xml, feed/ or feed/index.xml -- but nginx is
    # first-match-wins for regex locations, so order is documented rather than
    # relied upon.
    location ~ ^/(?:.+/)?(?:atom\.xml|feed/atom/(?:index\.xml)?)$ {
        types { }
        default_type "application/atom+xml; charset=utf-8";
        include /etc/nginx/snippets/louie-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ ^/(?:.+/)?(?:feed\.xml|feed/(?:index\.xml)?)$ {
        types { }
        default_type "application/rss+xml; charset=utf-8";
        include /etc/nginx/snippets/louie-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The overlay used to set a site-wide Access-Control-Allow-Origin of
    # https://louie.se. A fixed same-origin ACAO grants nothing that same-origin
    # access does not already have, so it is dropped: CORS now appears only on
    # feeds, where browser-based readers genuinely need it.
    #
    # X-XSS-Protection is also dropped. It is gone from current browsers and its
    # legacy filter mode was itself an XSS vector.

    location = /_headers {
        return 404;  # belt and braces if a stale copy is still on disk
    }
}
