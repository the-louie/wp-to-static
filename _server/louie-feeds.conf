# Feed serving for louie.se.
#
# INCLUDE THIS INSIDE YOUR EXISTING server { } BLOCK. It is not a server block
# itself and deliberately sets no listen/ssl/server_name, so it cannot clobber
# TLS, user-agent filtering, .well-known handling, or anything else already
# configured.
#
#     server {
#         ...your existing config...
#         include /etc/nginx/snippets/louie-feeds.conf;
#     }

# Makes /feed/ and /tag/<slug>/feed/ resolve to the index.xml aliases the
# generator writes. Without this nginx refuses the directory with 403, which
# breaks every pre-static WordPress feed URL. A request for /feed with no
# trailing slash gets a 301 to /feed/ from the index module, so those work too.
index index.html index.xml;

# Atom first. The two regexes are mutually exclusive -- a URL ending in
# feed/atom/ or feed/atom/index.xml cannot match the RSS alternative, which
# requires it to end in feed.xml, feed/ or feed/index.xml -- but nginx is
# first-match-wins for regex locations, so the order is documented rather than
# relied upon.
location ~ ^/(?:.+/)?(?:atom\.xml|feed/atom/(?:index\.xml)?)$ {
    types { }
    default_type "application/atom+xml; charset=utf-8";
    include /etc/nginx/snippets/louie-security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
}

location ~ ^/(?:.+/)?(?:feed\.xml|feed/(?:index\.xml)?)$ {
    types { }
    default_type "application/rss+xml; charset=utf-8";
    include /etc/nginx/snippets/louie-security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
}

# The overlay used to carry a site-wide Access-Control-Allow-Origin of
# https://louie.se. A fixed same-origin ACAO grants nothing that same-origin
# access does not already have, so CORS now appears only on feeds, where
# browser-based readers genuinely need it.

# Belt and braces: _headers was Cloudflare Pages syntax that nginx never read,
# and it was published at /_headers for anyone to fetch. Remove the stale file
# from the document root as well -- the upload has no --delete.
location = /_headers {
    return 404;
}
