# Legacy WordPress paths for louie.se.
#
# INCLUDE THIS INSIDE THE EXISTING server { } BLOCK, alongside the other
# snippets:
#
#     include sites/louie.se/legacy-paths.conf;
#
# The generator renames /wp-content/ to /content/ and /wp-includes/ to /inc/.
# Those paths are years old and appear in already-published feed items, in
# anything shared on social media, and in whatever hotlinks the images. Serving
# them from the new location keeps every one of those working.
#
# `alias` rather than `rewrite`: no redirect, no round trip, and the old URL
# keeps working transparently rather than announcing that it moved.
#
# These can be deleted once the old URLs have stopped being requested. The
# access log is how you find out -- something like:
#
#     grep -c ' /wp-content/' /var/log/nginx/louie.se.access.log

location ^~ /wp-content/ {
    alias /mnt/storage/louie.se/www2/content/;
    # Same expiry policy as any other static asset; nothing here is generated.
    access_log off;
}

location ^~ /wp-includes/ {
    alias /mnt/storage/louie.se/www2/inc/;
    access_log off;
}
