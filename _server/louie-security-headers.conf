# Security headers for louie.se.
#
# This lives in its own file because nginx's add_header inheritance is
# all-or-nothing per level: as soon as a location block contains ANY
# add_header, every add_header from the enclosing server block is dropped for
# that location. The feed locations need their own CORS header, so without
# including this file inside them too they would silently lose nosniff and the
# CSP -- on exactly the responses whose Content-Type we just started caring
# about.
#
# Include it at server level AND inside every location that sets a header.
#
# Carried over from _overlay/_headers with three corrections. That file was
# never parsed by anything, so none of this had ever been exercised:
#   - "fullscren=(self)" was a typo and matched no feature.
#   - "autoplay=self" is invalid Permissions-Policy syntax; an allowlist needs
#     parentheses, so the directive was ignored even where the header applied.
#   - "document-domain" and "vertical-scroll" are dropped as non-standard.

add_header X-Frame-Options                   "DENY"       always;
add_header X-Content-Type-Options            "nosniff"    always;
add_header X-Permitted-Cross-Domain-Policies "none"       always;
add_header Referrer-Policy                   "no-referrer" always;
add_header Permissions-Policy "autoplay=(self), fullscreen=(self), geolocation=(), microphone=(), display-capture=(), web-share=()" always;
add_header Content-Security-Policy "script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
add_header X-Hello-Nosey "WHAT ARE YOU DOING?!" always;
